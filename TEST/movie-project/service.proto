
syntax = "proto3";

package recommendation;

// Basic request for user-based recommendations.
message RecommendationRequest {
	string user_id = 1; // client user id
	int32 max_results = 2; // max recommendation count
}

message MovieRecommendation {
	string movie_id = 1;
	string title = 2;
}

message RecommendationResponse {
	repeated MovieRecommendation recommendations = 1;
}

// Request to find similar movies to a given movie id.
message SimilarRequest {
	string movie_id = 1;
	int32 max_results = 2;
}

message SimilarResponse {
	repeated MovieRecommendation recommendations = 1;
}

message HealthRequest {}
message HealthResponse { string status = 1; }

// Service boundary between backend-node and the Python recommendation engine.
service RecommendationService {
	// Returns recommendations for a user.
	rpc Recommend(RecommendationRequest) returns (RecommendationResponse);

	// Returns movies similar to the provided movie id.
	rpc SimilarMovies(SimilarRequest) returns (SimilarResponse);

	// Simple health check for the engine.
	rpc Health(HealthRequest) returns (HealthResponse);
}

